name: corerect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.3
  youtube_player_iframe: ^5.1.3
  image_picker: any

# Database packages
  sqflite: ^2.3.0
  path: ^1.8.3

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  google_mlkit_pose_detection: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/corerect-transparent-1.png
    - assets/corerect-transparent.png
    - assets/male-avatar.png
    - assets/female-avatar.png
    - assets/squat-avatar.png
    - assets/jumping-jack-avatar.png

