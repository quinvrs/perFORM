name: corerect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.3
  image_picker: any
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.5
  video_player: ^2.8.0

# Database packages
  sqflite: ^2.3.0
  path: ^1.8.3

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  google_mlkit_pose_detection: ^0.14.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app-icon.png"
  remove_alpha_ios: true
  
flutter:
  uses-material-design: true

  assets:
    - assets/corerect-transparent-1.png
    - assets/corerect-transparent.png
    - assets/male-avatar.png
    - assets/female-avatar.png
    - assets/squat-avatar.png
    - assets/jumping-jack-avatar.png
    - assets/squat.mp4
    - assets/jumpingjacks.mp4
    - assets/corerect-text-logo.png

